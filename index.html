<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">

</head>


<body>
    <nav class="navbar sm:navbar-expand bg-subtle-warning fg-2">
        <div class="container">
            <a class="navbar-brand" href="#">Chovatelská stanice</a>

            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Domů</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Štěňata</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">O plemeni a Péče</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" >Kontakt a Rezervace</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>




    <section class="py-12 hero-banner">
        <div class="container">
            <div class="row justify-content-end">
                <div class="col-md-7 text-center text-lg-start">
                    <h1 class="display-5 mb-3"></h1>
                    <p class="mb-5">
                        NAŠE ZVÍŘATA<br>

                    </p>
                </div>
            </div>
        </div>

    </section>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

</body>

</html>
